services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitrio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitrio}
      POSTGRES_DB: vitrio
    volumes:
      - vitrio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrio -d vitrio"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vitrio:${POSTGRES_PASSWORD:-vitrio}@db:5432/vitrio
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vitrio.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambiame-ahora}
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-Europe/Madrid}
      CRON_SECRET: ${CRON_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Vitrio <no-reply@vitrio.app>}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - "3000:3000"

volumes:
  vitrio-db:
